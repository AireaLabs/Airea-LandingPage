<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Airea</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <a class="auth-brand" href="index.html">
                <img src="assets/images/logo.png" alt="Logo de Airea" class="brand-logo">

                <span>
                    <span class="brand-name">Airea</span>
                    <span class="brand-caption">Inteligencia ambiental</span>
                </span>
            </a>
            <header class="auth-heading">
                <h1>Crea tu cuenta</h1>
                <p>Regístrate para acceder a una experiencia personalizada.</p>
            </header>
            <form class="auth-form" action="index.html" method="get">
                <div class="form-group">
                    <label for="full-name">Nombre</label>
                    <input
                        class="form-control"
                        id="full-name"
                        name="name"
                        type="text"
                        placeholder="Tu nombre"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="register-email">Correo electrónico</label>
                    <input
                        class="form-control"
                        id="register-email"
                        name="email"
                        type="email"
                        placeholder="usuario@correo.com"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="register-password">Contraseña</label>
                    <input
                        class="form-control"
                        id="register-password"
                        name="password"
                        type="password"
                        placeholder="Crea una contraseña"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input
                        class="form-control"
                        id="confirm-password"
                        name="confirm-password"
                        type="password"
                        placeholder="Repite tu contraseña"
                        required
                    >
                </div>
                <button class="btn btn-primary btn-block" type="submit">
                    <span class="material-symbols-rounded" aria-hidden="true">person_add</span>
                    Crear cuenta
                </button>
            </form>
            <footer class="auth-footer">
                <p>
                    ¿Ya tienes una cuenta?
                    <a href="login.html">Iniciar sesión</a>
                </p>
            </footer>
        </section>
    </main>
</body>
</html>
