<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Airea</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <a class="auth-brand" href="index.html">
                <img src="assets/images/logo.png" alt="Logo de Airea" class="brand-logo">
                <span>
                    <span class="brand-name">Airea</span>
                    <span class="brand-caption">Inteligencia ambiental</span>
                </span>
            </a>
            <header class="auth-heading">
                <h1>Bienvenido a Airea</h1>
                <p>Inicia sesión para revisar tus consultas y planificar tus actividades.</p>
            </header>
            <form class="auth-form" action="index.html" method="get">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        class="form-control"
                        id="email"
                        name="email"
                        type="email"
                        placeholder="usuario@correo.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        class="form-control"
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >
                </div>

                <button class="btn btn-primary btn-block" type="submit">
                    <span class="material-symbols-rounded" aria-hidden="true">login</span>
                    Iniciar sesión
                </button>
            </form>
            <footer class="auth-footer">
                <p>
                    ¿Aún no tienes una cuenta?
                    <a href="registro.html">Crear cuenta</a>
                </p>
            </footer>
        </section>
    </main>
</body>
</html>
